services:
  - type: web
    name: sneaker-drop-socket
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm run start -w @sneaker-drop/socket
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SOCKET_AUTH_SECRET
        sync: false
      - key: SOCKET_ALLOWED_ORIGINS
        sync: false
      - key: SOCKET_TOKEN_ISSUER
        value: sneaker-drop-api
      - key: SOCKET_TOKEN_AUDIENCE
        value: sneaker-drop-socket
      - key: SOCKET_DB_POOL_MAX
        value: 5
      - key: OUTBOX_BATCH_SIZE
        value: 100
      - key: OUTBOX_POLL_INTERVAL_MS
        value: 250
